name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 on each OS; windows-11-arm exercises the emulated amd64 fallback
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module -Name Pester -RequiredVersion 6.2.0
          $Config = New-PesterConfiguration
          $Config.Run.Path = './tests'
          $Config.Run.Exit = $true
          $Config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $Config
